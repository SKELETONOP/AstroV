[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

# Renamed location slugs (spelling fixes) — keep old URLs' ranking via permanent redirects.
[[redirects]]
  from = "/locations/karol-bag"
  to = "/locations/karol-bagh"
  status = 301
  force = true

[[redirects]]
  from = "/locations/gujrat"
  to = "/locations/gujarat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
